name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/android-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-DJS-VIP-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chat-djs-vip-v3-build-${{ github.run_number }}
          name: CHAT DJ'S VIP v3 - Build ${{ github.run_number }}
          body: APK independiente de CHAT DJ'S VIP v3, con firma estable para futuras actualizaciones.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
