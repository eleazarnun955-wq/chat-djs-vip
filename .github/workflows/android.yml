name: Android APK
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Read app version
        id: app-version
        run: |
          APP_VERSION=$(awk -F '"' '/versionName[[:space:]]*=/ {print $2; exit}' app/build.gradle.kts)
          if [ -z "$APP_VERSION" ]; then
            echo "No se pudo detectar versionName en app/build.gradle.kts"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/android-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Run unit tests, lint and build APK
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature, alignment and Android package
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.djsebas.chatdjsvip.v320'" /tmp/apk-badging.txt
          grep -q "versionCode='53' versionName='3.8.1'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/apk-badging.txt
          echo "APK validada: firma, alineación, applicationId, versionCode, versionName y minSdk correctos."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-DJS-VIP-${{ env.APP_VERSION }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chat-dj-vip-${{ env.APP_VERSION }}-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CHAT DJ'S VIP ${{ env.APP_VERSION }} - Actualización
          body: CHAT DJ'S VIP ${{ env.APP_VERSION }}. Compilación validada con pruebas unitarias y Android Lint. Conserva el paquete y la firma de la instalación existente.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
